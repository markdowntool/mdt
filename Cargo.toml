[package]
name = "mdt"
version = "0.1.1"
description = "Read, compare and safely edit saved Markdown"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/markdowntool/mdt"
publish = false

[workspace]
members = ["crates/mdt-core"]
resolver = "2"

[dependencies]
mdt-core = { path = "crates/mdt-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.1.9"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.39"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
